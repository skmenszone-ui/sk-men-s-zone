<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SK Men's Zone - Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#172033;
}

/* HEADER */

.admin-header{
    background:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
}

.admin-brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.admin-brand img{
    width:60px;
    height:60px;
    object-fit:contain;
}

.admin-brand h2{
    margin:0;
    letter-spacing:2px;
}

.admin-brand p{
    margin:5px 0 0;
    font-size:11px;
    letter-spacing:3px;
    color:#777;
}

.website-btn{
    text-decoration:none;
    background:#172033;
    color:white;
    padding:11px 20px;
    border-radius:6px;
}

/* LOGIN */

.login-section{
    min-height:75vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.1);
}

.login-logo{
    text-align:center;
}

.login-logo img{
    width:80px;
    height:80px;
    object-fit:contain;
}

.login-box h1{
    text-align:center;
    margin:20px 0 30px;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #ddd;
    border-radius:6px;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:6px;
    background:#172033;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#loginMessage{
    text-align:center;
}

/* ADMIN PANEL */

#adminPanel{
    display:none;
    padding:40px 6%;
}

.panel-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.panel-top h1{
    margin:0;
}

.logout-btn{
    background:#d32f2f;
    color:white;
    border:0;
    padding:11px 20px;
    border-radius:6px;
    cursor:pointer;
}

/* GRID */

.admin-grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:25px;
}

.admin-card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.admin-card h2{
    margin-top:0;
}

/* INPUTS */

.admin-card input,
.admin-card select{
    width:100%;
    padding:13px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:6px;
}

/* IMAGE UPLOAD */

.image-upload{
    border:2px dashed #aaa;
    padding:20px;
    text-align:center;
    border-radius:8px;
    margin-bottom:15px;
}

.image-upload input{
    border:0;
    margin:0;
    padding:0;
}

.image-preview{
    width:100%;
    height:180px;
    object-fit:contain;
    background:#f4f4f4;
    margin-top:15px;
    display:none;
    border-radius:6px;
}

/* BUTTON */

.add-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:6px;
    background:#172033;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.cancel-btn{
    width:100%;
    padding:12px;
    border:0;
    border-radius:6px;
    background:#777;
    color:white;
    margin-top:10px;
    cursor:pointer;
    display:none;
}

/* PRODUCTS */

.product-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.admin-product{
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    background:white;
}

.admin-product img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.admin-product-content{
    padding:15px;
}

.admin-product h3{
    margin:0 0 8px;
}

.admin-product p{
    margin:6px 0;
    color:#666;
}

/* PRODUCT BUTTONS */

.edit-btn,
.delete-btn{
    width:100%;
    padding:10px;
    border:0;
    border-radius:5px;
    color:white;
    cursor:pointer;
    margin-top:8px;
}

.edit-btn{
    background:#1976d2;
}

.delete-btn{
    background:#d32f2f;
}

/* FOOTER */

footer{
    margin-top:50px;
    background:#172033;
    color:white;
    text-align:center;
    padding:25px;
}

/* MOBILE */

@media(max-width:900px){

    .admin-grid{
        grid-template-columns:1fr;
    }

    .product-list{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .product-list{
        grid-template-columns:1fr;
    }

    #adminPanel{
        padding:25px 15px;
    }

}

</style>
</head>

<body>


<!-- HEADER -->

<header class="admin-header">

    <div class="admin-brand">

        <img src="images/logo.jpg"
             alt="SK Men's Zone">

        <div>

            <h2>SK MEN'S ZONE</h2>

            <p>ADMIN PANEL</p>

        </div>

    </div>

    <a href="index.html"
       class="website-btn">

       WEBSITE

    </a>

</header>


<!-- LOGIN -->

<section
    class="login-section"
    id="loginSection">

    <div class="login-box">

        <div class="login-logo">

            <img
                src="images/logo.jpg"
                alt="Logo">

        </div>

        <h1>Admin Login</h1>

        <form
            onsubmit="loginAdmin(event)">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button
                type="submit"
                class="login-btn">

                LOGIN

            </button>

        </form>

        <p id="loginMessage"></p>

    </div>

</section>


<!-- ADMIN PANEL -->

<section id="adminPanel">

    <div class="panel-top">

        <div>

            <h1>Admin Dashboard</h1>

            <p>
                Manage your products
            </p>

        </div>

        <button
            class="logout-btn"
            onclick="logoutAdmin()">

            LOGOUT

        </button>

    </div>


    <div class="admin-grid">


        <!-- ADD / UPDATE PRODUCT -->

        <div class="admin-card">

            <h2 id="formTitle">
                Add New Product
            </h2>


            <form
                onsubmit="saveProduct(event)">

                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                    required>


                <select
                    id="productCategory"
                    required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Shirts">
                        Shirts
                    </option>

                    <option value="T-Shirts">
                        T-Shirts
                    </option>

                    <option value="Jeans">
                        Jeans
                    </option>

                    <option value="Pants">
                        Pants
                    </option>

                    <option value="Jackets">
                        Jackets
                    </option>

                </select>


                <input
                    type="number"
                    id="productPrice"
                    placeholder="Price"
                    required>


                <input
                    type="number"
                    id="productOldPrice"
                    placeholder="Old Price">


                <input
                    type="number"
                    id="productDiscount"
                    placeholder="Discount %">


                <!-- IMAGE -->

                <div class="image-upload">

                    <strong>
                        Product Image
                    </strong>

                    <p>
                        Choose product image
                    </p>

                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                        onchange="previewImage(event)">

                    <img
                        id="imagePreview"
                        class="image-preview">

                </div>


                <button
                    type="submit"
                    class="add-btn"
                    id="saveButton">

                    + ADD PRODUCT

                </button>


                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelButton"
                    onclick="cancelEdit()">

                    CANCEL EDIT

                </button>

            </form>

        </div>


        <!-- PRODUCTS -->

        <div class="admin-card">

            <h2>
                Products
            </h2>

            <div
                id="adminProductList"
                class="product-list">

            </div>

        </div>

    </div>

</section>


<footer>

    <h3>
        SK MEN'S ZONE
    </h3>

    <p>
        Premium Men's Fashion Store
    </p>

    <p>
        © 2026 SK Men's Zone
    </p>

</footer>


<script>

/* ======================================
   LOGIN
====================================== */

const ADMIN_USERNAME = "skmenszone";
const ADMIN_PASSWORD = "sk@460";


function loginAdmin(event){

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("loginMessage");


    if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ){

        localStorage.setItem(
            "skAdminLogin",
            "true"
        );

        message.style.color = "green";

        message.innerText =
            "Login successful.";

        setTimeout(function(){

            showAdminPanel();

        },500);

    }

    else{

        message.style.color = "red";

        message.innerText =
            "Invalid username or password.";

    }

}


/* ======================================
   SHOW PANEL
====================================== */

function showAdminPanel(){

    document.getElementById(
        "loginSection"
    ).style.display = "none";

    document.getElementById(
        "adminPanel"
    ).style.display = "block";

    displayProducts();

}


/* ======================================
   LOGOUT
====================================== */

function logoutAdmin(){

    localStorage.removeItem(
        "skAdminLogin"
    );

    location.reload();

}


/* ======================================
   GET PRODUCTS
====================================== */

function getProducts(){

    return JSON.parse(
        localStorage.getItem(
            "skProducts"
        ) || "[]"
    );

}


/* ======================================
   IMAGE PREVIEW
====================================== */

function previewImage(event){

    const file =
        event.target.files[0];

    const preview =
        document.getElementById(
            "imagePreview"
        );


    if(file){

        const reader =
            new FileReader();


        reader.onload = function(e){

            preview.src =
                e.target.result;

            preview.style.display =
                "block";

        };


        reader.readAsDataURL(file);

    }

}


/* ======================================
   EDIT PRODUCT ID
====================================== */

let editingProductId = null;

let selectedImage = "";


/* ======================================
   SAVE PRODUCT
====================================== */

function saveProduct(event){

    event.preventDefault();


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const category =
        document.getElementById(
            "productCategory"
        ).value;


    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );


    const oldPrice =
        Number(
            document.getElementById(
                "productOldPrice"
            ).value
        ) || 0;


    const discount =
        Number(
            document.getElementById(
                "productDiscount"
            ).value
        ) || 0;


    const imageInput =
        document.getElementById(
            "productImage"
        );


    let products =
        getProducts();


    /* ADD NEW PRODUCT */

    if(editingProductId === null){

        if(
            imageInput.files.length === 0
        ){

            alert(
                "Please select a product image."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload = function(e){

            const product = {

                id: Date.now(),

                name: name,

                category: category,

                price: price,

                oldPrice: oldPrice,

                discount: discount,

                image: e.target.result

            };


            products.push(product);


            localStorage.setItem(
                "skProducts",
                JSON.stringify(products)
            );


            alert(
                "Product added successfully!"
            );


            resetForm();

            displayProducts();

        };


        reader.readAsDataURL(
            imageInput.files[0]
        );

    }


    /* UPDATE EXISTING PRODUCT */

    else{

        const index =
            products.findIndex(
                function(product){

                    return product.id ===
                           editingProductId;

                }
            );


        if(index === -1){

            return;

        }


        products[index].name =
            name;

        products[index].category =
            category;

        products[index].price =
            price;

        products[index].oldPrice =
            oldPrice;

        products[index].discount =
            discount;


        /*
          If new image selected,
          replace old image.
        */

        if(
            imageInput.files.length > 0
        ){

            const reader =
                new FileReader();


            reader.onload =
                function(e){

                    products[index].image =
                        e.target.result;

                    finishUpdate(
                        products
                    );

                };


            reader.readAsDataURL(
                imageInput.files[0]
            );

        }

        else{

            finishUpdate(
                products
            );

        }

    }

}


/* ======================================
   FINISH UPDATE
====================================== */

function finishUpdate(products){

    localStorage.setItem(
        "skProducts",
        JSON.stringify(products)
    );


    alert(
        "Product updated successfully!"
    );


    resetForm();

    displayProducts();

}


/* ======================================
   EDIT PRODUCT
====================================== */

function editProduct(id){

    const products =
        getProducts();


    const product =
        products.find(
            function(item){

                return item.id === id;

            }
        );


    if(!product){

        return;

    }


    editingProductId =
        id;


    document.getElementById(
        "productName"
    ).value =
        product.name;


    document.getElementById(
        "productCategory"
    ).value =
        product.category;


    document.getElementById(
        "productPrice"
    ).value =
        product.price;


    document.getElementById(
        "productOldPrice"
    ).value =
        product.oldPrice;


    document.getElementById(
        "productDiscount"
    ).value =
        product.discount;


    /*
       Show old image
    */

    const preview =
        document.getElementById(
            "imagePreview"
        );


    preview.src =
        product.image;

    preview.style.display =
        "block";


    document.getElementById(
        "formTitle"
    ).innerText =
        "Update Product";


    document.getElementById(
        "saveButton"
    ).innerText =
        "UPDATE PRODUCT";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ======================================
   DELETE PRODUCT
====================================== */

function deleteProduct(id){

    if(
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ){

        return;

    }


    let products =
        getProducts();


    products =
        products.filter(
            function(product){

                return product.id !== id;

            }
        );


    localStorage.setItem(
        "skProducts",
        JSON.stringify(products)
    );


    displayProducts();

}


/* ======================================
   DISPLAY PRODUCTS
====================================== */

function displayProducts(){

    const container =
        document.getElementById(
            "adminProductList"
        );


    const products =
        getProducts();


    container.innerHTML = "";


    if(products.length === 0){

        container.innerHTML =
            "<p>No products added yet.</p>";

        return;

    }


    products.forEach(
        function(product){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "admin-product";


            card.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <div
                    class="admin-product-content">

                    <h3>
                        ${product.name}
                    </h3>

                    <p>
                        ${product.category}
                    </p>

                    <strong>
                        ₹${product.price}
                    </strong>

                    <button
                        class="edit-btn"
                        onclick="editProduct(${product.id})">

                        EDIT / CHANGE IMAGE

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${product.id})">

                        DELETE

                    </button>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* ======================================
   CANCEL EDIT
====================================== */

function cancelEdit(){

    resetForm();

}


/* ======================================
   RESET FORM
====================================== */

function resetForm(){

    editingProductId =
        null;


    document.querySelector(
        "#adminPanel form"
    ).reset();


    document.getElementById(
        "formTitle"
    ).innerText =
        "Add New Product";


    document.getElementById(
        "saveButton"
    ).innerText =
        "+ ADD PRODUCT";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";


    const preview =
        document.getElementById(
            "imagePreview"
        );


    preview.src = "";

    preview.style.display =
        "none";

}


/* ======================================
   CHECK LOGIN
====================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        const loggedIn =
            localStorage.getItem(
                "skAdminLogin"
            );


        if(loggedIn === "true"){

            showAdminPanel();

        }

    }
);

</script>

</body>
</html>
